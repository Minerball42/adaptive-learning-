  /api/quizzes/adaptive/:
    get:
      operationId: quizzes_adaptive_retrieve
      description: Create a new adaptive quiz session for the authenticated student.
        Question difficulty is selected according to the student's current topic mastery.
      summary: Create adaptive quiz session
      parameters:
      - in: query
        name: topic
        schema:
          type: integer
        description: ID of the topic for which an adaptive quiz should be generated.
        required: true
      tags:
      - Adaptive Quiz
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdaptiveQuizResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizErrorResponse'
          description: ''
  /api/quizzes/adaptive/submit/:
    post:
      operationId: quizzes_adaptive_submit_create
      description: Submit answers for an active adaptive quiz session. The server
        validates the exact questions assigned to the session, scores the attempt,
        recalculates mastery, and selects the next adaptive difficulty.
      summary: Submit adaptive quiz session
      tags:
      - Adaptive Quiz
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdaptiveQuizSubmitRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdaptiveQuizSubmitRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdaptiveQuizSubmitRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
