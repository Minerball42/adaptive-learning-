            application/json:
              schema:
                $ref: '#/components/schemas/AdaptiveQuizSubmitResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizErrorResponse'
          description: ''
