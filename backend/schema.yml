  /api/progress/attempts/:
    get:
      operationId: progress_attempts_list
      description: Return quiz attempts and detailed answers. This endpoint is restricted
        to teachers or administrators.
      summary: Get quiz attempt results
      tags:
      - Progress
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
