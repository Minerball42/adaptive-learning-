openapi: 3.0.3
info:
  title: Adaptive Learning Platform API
  version: 1.0.0
  description: Backend API for the Adaptive Learning Platform. Includes student authentication,
    curriculum, adaptive quizzes, progress tracking, teacher analytics, and offline
    synchronization.
paths:
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Authenticate a registered student and return a token.
      summary: Student login
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentLoginResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/auth/profile/:
    get:
      operationId: auth_profile_retrieve
      description: Return the authenticated student's profile.
      summary: Get student profile
      tags:
      - Authentication
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProfile'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      description: Create a new student account and return an authentication token.
      summary: Register a student
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentRegister'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StudentRegister'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StudentRegister'
        required: true
      security:
      - tokenAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentRegisterResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/auth/students/{student_id}/grade/:
    post:
      operationId: auth_students_grade_create
      description: Allow a teacher or administrator to assign a grade to a student.
      summary: Assign grade to student
      parameters:
      - in: path
        name: student_id
        schema:
          type: integer
        required: true
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignStudentGradeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssignStudentGradeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssignStudentGradeRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignStudentGradeResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
