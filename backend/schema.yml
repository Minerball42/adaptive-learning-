  /api/sync/batch/:
    post:
      operationId: sync_batch_create
      description: Upload multiple offline quiz attempts in a single request. A maximum
        of 50 attempts can be processed at once. Each attempt is synchronized independently
        and duplicate client_attempt_id values are handled idempotently.
      summary: Synchronize multiple offline attempts
      tags:
      - Offline Sync
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfflineBatchSyncRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OfflineBatchSyncRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OfflineBatchSyncRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfflineBatchSyncResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfflineSyncErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfflineSyncErrorResponse'
          description: ''
  /api/sync/quiz-attempts/:
    post:
      operationId: sync_quiz_attempts_create
      description: Upload one quiz attempt completed while the student was offline.
        The server validates the payload, scores the answers, creates the quiz attempt
        and recalculates topic mastery. Reusing the same client_attempt_id returns
        the existing synchronized attempt instead of creating a duplicate.
      summary: Synchronize offline quiz attempt
      tags:
      - Offline Sync
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfflineQuizAttemptRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OfflineQuizAttemptRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OfflineQuizAttemptRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfflineSyncSuccessResponse'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfflineSyncSuccessResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfflineSyncErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfflineSyncErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfflineSyncErrorResponse'
          description: ''
  /api/sync/status/:
    get:
      operationId: sync_status_retrieve
      description: Return the authenticated student's offline synchronization summary
        and up to the 50 most recent synchronization records.
      summary: Get offline synchronization status
      tags:
      - Offline Sync
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfflineSyncStatusResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfflineSyncErrorResponse'
          description: ''
