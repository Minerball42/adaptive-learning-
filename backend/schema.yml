          description: ''
  /api/progress/submit/:
    post:
      operationId: progress_submit_create
      description: Submit answers for a standard quiz. All questions in the quiz must
        be answered.
      summary: Submit standard quiz
      tags:
      - Progress
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitQuizRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SubmitQuizRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SubmitQuizRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitQuizResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressErrorResponse'
          description: ''
  /api/progress/topic-performance/:
